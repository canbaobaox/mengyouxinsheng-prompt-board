<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>梦由心生提示词板1.0</title>
<style>
  :root{
    --bg:#ffffff; --surface:#ffffff; --surface-alt:#f4f4f2; --text:#161616; --dim:#6d6d6d; --border:#dcdcdc;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121212; --surface:#1b1b1b; --surface-alt:#232323; --text:#f2f2f2; --dim:#a3a3a3; --border:#3a3a3a; }
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; font-size:16px; line-height:1.5; }
  button{ font:inherit; cursor:pointer; color:inherit; }
  input,textarea{ font:inherit; color:inherit; }
  .wrap{ max-width:760px; margin:0 auto; padding:16px 16px 264px; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  /* 模式切换 */
  .modebar{ display:flex; gap:8px; align-items:stretch; }
  .modebtn{ border:1px solid var(--border); background:transparent; color:var(--dim); border-radius:10px; padding:10px 20px; font-size:15px; font-weight:500; }
  .modebtn.on{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .favbtn{ margin-left:auto; border:1px solid var(--border); background:transparent; border-radius:10px; padding:10px 16px; font-size:14px; }
  .hintline{ margin-top:8px; font-size:12px; color:var(--dim); }
  /* 进度连线 */
  .progress{ margin-top:16px; display:flex; align-items:center; }
  .pstep{ display:flex; align-items:center; }
  .pdot{ width:22px; height:22px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--border); font-size:11px; color:var(--dim); background:transparent; }
  .pdot.done{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .pline{ margin:0 2px; height:1px; flex:1; background:var(--border); min-width:6px; }
  .pline.done{ background:var(--text); }
  .ptext{ margin-top:6px; font-size:12px; color:var(--dim); }
  /* 模板 */
  .templates{ margin-top:12px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .templates .lbl{ font-size:12px; color:var(--dim); }
  .tplbtn{ border:1px dashed var(--border); background:transparent; border-radius:8px; padding:6px 12px; font-size:13px; color:var(--dim); }
  /* 避坑 */
  .warnbox{ margin-top:12px; border:1px solid var(--border); background:var(--surface-alt); border-radius:14px; padding:12px 16px; }
  .warnbox p.t{ margin:0; font-size:14px; font-weight:600; }
  .warnbox p{ margin:4px 0 0; font-size:14px; line-height:1.6; color:var(--dim); }
  .tipbox{ margin-top:12px; border-radius:14px; background:var(--surface-alt); padding:10px 16px; font-size:13px; line-height:1.6; color:var(--dim); }
  /* 步骤 */
  .steps{ margin-top:20px; display:flex; flex-direction:column; gap:24px; }
  .stephead{ margin-bottom:8px; }
  .stepnum{ display:inline-block; border:1px solid var(--border); border-radius:999px; padding:2px 10px; font-size:12px; color:var(--dim); margin-right:8px; }
  .stephint{ font-size:12px; color:var(--dim); }
  .fld{ margin:12px 0 6px; font-size:12px; font-weight:500; color:var(--dim); }
  .fld:first-child{ margin-top:0; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ border:1px solid var(--border); background:transparent; color:var(--text); border-radius:10px; padding:8px 12px; text-align:left; }
  .chip .cl{ display:block; font-size:15px; font-weight:500; line-height:1.35; }
  .chip .cs{ display:block; margin-top:2px; font-size:12px; line-height:1.35; color:var(--dim); }
  .chip.on{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .chip.on .cs{ color:var(--bg); opacity:.75; }
  .chip .customtag{ margin-left:4px; font-size:10px; opacity:.6; font-weight:400; }
  .customrow{ margin-top:8px; display:flex; gap:8px; }
  .customrow input{ flex:1; min-width:0; border:1px dashed var(--border); background:transparent; border-radius:10px; padding:6px 12px; font-size:14px; outline:none; }
  .customrow button{ flex:none; border:1px solid var(--border); background:transparent; border-radius:10px; padding:6px 12px; font-size:14px; }
  .multinote{ margin-top:4px; font-size:12px; color:var(--dim); }
  .textin{ width:100%; border:1px solid var(--border); background:transparent; border-radius:10px; padding:10px 12px; font-size:15px; outline:none; }
  .textin:focus{ border-color:var(--text); }
  textarea.textin{ font-size:14px; line-height:1.6; resize:vertical; }
  /* 参考分工行 */
  .refrow{ display:flex; width:100%; align-items:flex-start; gap:12px; border:1px solid var(--border); background:transparent; border-radius:10px; padding:10px 12px; text-align:left; margin-bottom:8px; }
  .refrow .box{ margin-top:2px; width:20px; height:20px; flex:none; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:5px; font-size:12px; }
  .refrow .rl{ display:block; font-size:15px; font-weight:500; }
  .refrow .rd{ display:block; font-size:12px; color:var(--dim); }
  .refrow.on{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .refrow.on .box{ border-color:var(--bg); }
  .refrow.on .rd{ color:var(--bg); opacity:.75; }
  .primarybtn{ background:var(--text); color:var(--bg); border:none; border-radius:10px; padding:8px 16px; font-size:14px; font-weight:500; }
  .primarybtn:disabled{ opacity:.4; }
  /* 时间轴 */
  .beatrow{ display:flex; gap:8px; margin-bottom:8px; }
  .beatrow .bt{ width:96px; flex:none; border:1px solid var(--border); background:transparent; border-radius:10px; padding:8px; text-align:center; font-size:14px; outline:none; }
  .beatrow .ba{ flex:1; min-width:0; border:1px solid var(--border); background:transparent; border-radius:10px; padding:8px 12px; font-size:14px; outline:none; }
  .rowbtns{ display:flex; gap:8px; }
  .rowbtns button{ border:1px solid var(--border); background:transparent; border-radius:10px; padding:8px 16px; font-size:14px; }
  /* 收藏 */
  .favcard{ border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; }
  .favcard .top{ display:flex; align-items:center; gap:8px; }
  .favtag{ background:var(--text); color:var(--bg); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:500; }
  .favcard h3{ margin:0; flex:1; min-width:0; font-size:16px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .favcard time{ flex:none; font-size:12px; color:var(--dim); }
  .favcard .fp{ margin:8px 0 0; font-size:14px; line-height:1.6; color:var(--dim); white-space:pre-wrap; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .favcard .acts{ margin-top:12px; display:flex; gap:8px; }
  .favempty{ border:1px dashed var(--border); border-radius:14px; padding:40px 20px; text-align:center; }
  /* 底部拼装区 */
  .dock{ position:fixed; left:0; right:0; bottom:0; z-index:40; border-top:1px solid var(--border); background:var(--surface); padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -6px 24px rgba(0,0,0,.06); }
  .dockin{ max-width:760px; margin:0 auto; padding:8px 16px 10px; }
  .docktop{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .docktop p{ margin:0; font-size:12px; font-weight:500; color:var(--dim); }
  .clearlink{ flex:none; font-size:12px; font-weight:500; color:var(--dim); background:none; border:none; text-decoration:underline; text-underline-offset:2px; padding:0; }
  .preview{ margin-top:5px; max-height:76px; overflow-y:auto; border:1px solid var(--border); border-radius:10px; padding:8px 12px; }
  .preview p{ margin:0; white-space:pre-wrap; font-size:14px; line-height:1.6; }
  .preview .empty{ color:var(--dim); }
  .dockbtns{ margin-top:8px; display:flex; gap:8px; }
  .copybtn{ flex:1; background:var(--text); color:var(--bg); border:none; border-radius:10px; padding:10px; font-size:15px; font-weight:600; }
  .savebtn{ border:1px solid var(--text); background:transparent; border-radius:10px; padding:10px 20px; font-size:15px; font-weight:500; }
  /* 弹窗与提示 */
  .overlay{ position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:640px){ .overlay{ align-items:center; } }
  .sheet{ width:100%; max-width:448px; background:var(--surface); border-radius:24px 24px 0 0; padding:20px; padding-bottom:max(20px, env(safe-area-inset-bottom)); }
  @media (min-width:640px){ .sheet{ border-radius:24px; } }
  .sheet h3{ margin:0; font-size:18px; font-weight:700; }
  .sheet .sub{ margin-top:4px; font-size:14px; color:var(--dim); }
  .sheet label.fl{ display:block; margin-top:16px; font-size:14px; font-weight:500; }
  .sheet .fin{ margin-top:6px; width:100%; border:1px solid var(--border); background:var(--bg); border-radius:14px; padding:12px 14px; font-size:15px; outline:none; }
  .sheet .btns{ margin-top:16px; display:flex; gap:8px; }
  .sheet .btns button{ flex:1; border-radius:999px; padding:12px; font-size:15px; }
  .btn-ghost{ border:1px solid var(--border); background:transparent; font-weight:500; }
  .btn-solid{ border:none; background:var(--text); color:var(--bg); font-weight:600; }
  /* 赞赏作者 */
  .tipqrs{ margin-top:16px; display:flex; gap:12px; }
  .tipqr{ flex:1; margin:0; }
  .tipqr img{ display:block; width:100%; border:1px solid var(--border); border-radius:14px; background:#fff; }
  .tipqr figcaption{ margin-top:8px; font-size:13px; color:var(--dim); text-align:center; }
  .toast{ position:fixed; left:50%; top:max(12px, env(safe-area-inset-top)); transform:translateX(-50%); z-index:80; background:var(--text); color:var(--bg); border-radius:999px; padding:8px 16px; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.18); max-width:92vw; text-align:center; }
  .hidden{ display:none !important; }
  /* 手机上整体收紧，让第 2 步主体输入框完整露在底部拼装栏上方 */
  @media (max-width:640px){
    .wrap{ padding-top:10px; }
    .modebtn{ padding:7px 14px; }
    .favbtn{ padding:7px 12px; }
    .hintline{ margin-top:6px; }
    .progress{ margin-top:10px; }
    .ptext{ margin-top:4px; }
    .templates{ margin-top:8px; }
    .steps{ margin-top:14px; gap:18px; }
    .stephead{ margin-bottom:6px; }
    .chip{ padding:6px 11px; }
    .customrow{ margin-top:6px; }
    .preview{ max-height:60px; }
  }
</style>
</head>
<body>
<div id="toast" class="toast hidden" role="status"></div>
<main class="wrap">
  <div class="modebar" role="tablist" aria-label="模式切换">
    <button type="button" id="tab-img" class="modebtn" role="tab" aria-label="图片模式">图片模式</button>
    <button type="button" id="tab-vid" class="modebtn" role="tab" aria-label="人设视频模式">人设视频模式</button>
    <button type="button" id="btn-favs" class="favbtn" aria-label="打开我的收藏">★ 收藏（0）</button>
    <button type="button" id="btn-tip" class="favbtn" aria-label="赞赏作者">♥ 赞赏作者</button>
  </div>
  <p class="hintline" id="mode-hint"></p>

  <div class="progress" id="progress" aria-label="连线进度"></div>
  <p class="ptext" id="progress-text"></p>

  <div class="templates" id="templates"></div>

  <div class="warnbox hidden" id="warnbox" role="alert" aria-label="避坑提示"></div>
  <p class="tipbox hidden" id="vidtip">小提示：生成不满意时，一次只改一步（比如只换运镜），别整条推翻重写——这样才知道是哪一步的问题。</p>

  <section id="favs-view" class="hidden" style="margin-top:24px" aria-label="我的收藏列表"></section>
  <div id="board"></div>
</main>

<div class="dock" id="dock">
  <div class="dockin">
    <div class="docktop">
      <p id="dock-meta"></p>
      <button type="button" class="clearlink" id="btn-clear" aria-label="清空当前模式">清空重连</button>
    </div>
    <div class="preview" aria-live="polite" aria-label="拼好的提示词预览"><p id="preview-text"></p></div>
    <div class="dockbtns">
      <button type="button" class="copybtn" id="btn-copy" aria-label="复制提示词">复制提示词</button>
      <button type="button" class="savebtn" id="btn-save" aria-label="保存当前组合">保存组合</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="save-modal" role="dialog" aria-modal="true" aria-label="保存组合">
  <div class="sheet">
    <h3>保存这个组合</h3>
    <p class="sub">存在这台设备的浏览器里，下次打开在「收藏」里点载入，就能接着改。</p>
    <label class="fl" for="fav-name">组合名称</label>
    <input class="fin" id="fav-name" type="text" maxlength="60" />
    <div class="btns">
      <button type="button" class="btn-ghost" id="save-cancel" aria-label="取消保存">取消</button>
      <button type="button" class="btn-solid" id="save-confirm" aria-label="确认保存组合">保存</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="clear-modal" role="dialog" aria-modal="true" aria-label="确认清空">
  <div class="sheet">
    <h3 id="clear-title">清空已选？</h3>
    <p class="sub" id="clear-sub"></p>
    <div class="btns">
      <button type="button" class="btn-ghost" id="clear-cancel" aria-label="取消清空">先不清空</button>
      <button type="button" class="btn-solid" id="clear-confirm" aria-label="确认清空当前模式">确认清空</button>
    </div>
  </div>
</div>
<div class="overlay hidden" id="tip-modal" role="dialog" aria-modal="true" aria-label="赞赏作者">
  <div class="sheet">
    <h3>赞赏作者</h3>
    <p class="sub">喜欢这个工具的话，可以扫码支持一下作者。</p>

function copyText(text){
function fallback(){
var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
var ok = false; try { ok = document.execCommand("copy");} catch (e) { ok = false;}
document.body.removeChild(ta); return ok;
}
if (navigator.clipboard && navigator.clipboard.writeText) {
return navigator.clipboard.writeText(text).then(function(){ return true;}, function(){ return fallback();});
}
return Promise.resolve(fallback());
}
function pick(field, label){

pick(field, label);
}

document.getElementById("dock-meta").textContent = "拼好的提示词 · " + (isImage()? "图片": "视频") + " · 已连 " + doneCount + "/" + done.length + " 步" + (prompt? " · " + prompt.length + " 字": "");
var pv = document.getElementById("preview-text");
if (prompt) { pv.textContent = prompt; pv.className = "";} else { pv.textContent = "从第 1 步开始点选，这里会实时拼成一整段提示词。"; pv.className = "empty";}
saveLocal();
}

function applyFavorite(id){
var fav = favorites.filter(function(x){ return String(x.id) === String(id);})[0];
if (!fav) return;
try {
var p = JSON.parse(fav.selections);
if (fav.mode === "video") {
if (p.vid) vid = Object.assign(vidInit(), p.vid);
if (p.vidCustoms) vidCustoms = p.vidCustoms;
if (typeof p.baseline === "string") baseline = p.baseline;
mode = "video";
} else {
if (p.img) img = Object.assign(imgInit(), p.img);
if (p.imgCustoms) imgCustoms = p.imgCustoms;
mode = "image";
}
view = "board"; render(); toast("已载入这个组合，可以继续改");
} catch (e) { toast("这条收藏的数据损坏了，载入失败");}
}

document.getElementById("tab-img").addEventListener("click", function(){ mode = "image"; view = "board"; render();});
document.getElementById("tab-vid").addEventListener("click", function(){ mode = "video"; view = "board"; render();});
document.getElementById("btn-favs").addEventListener("click", function(){ view = view === "favs"? "board": "favs"; render();});
document.getElementById("btn-copy").addEventListener("click", function(){
var prompt = buildPrompt();
if (!prompt) { toast("先点选几项，拼出提示词再复制"); return;}
copyText(prompt).then(function(ok){ toast(ok? "已复制，去即梦粘贴就能用": "复制失败，请长按预览文字手动复制");});
});
document.getElementById("btn-save").addEventListener("click", function(){
var prompt = buildPrompt();
if (!prompt) { toast("先拼出提示词再保存"); return;}
document.getElementById("fav-name").value = (isImage()? "图片": "视频") + " · " + new Date().toLocaleDateString("zh-CN");
document.getElementById("save-modal").classList.remove("hidden");
});
document.getElementById("save-cancel").addEventListener("click", function(){ document.getElementById("save-modal").classList.add("hidden");});
document.getElementById("save-confirm").addEventListener("click", function(){
var name = document.getElementById("fav-name").value.trim();
if (!name) { toast("给这个组合起个名字"); return;}
favorites.unshift({ id: Date.now(), name: name, mode: mode, prompt: buildPrompt(), date: new Date().toLocaleDateString("zh-CN"), selections: JSON.stringify(isImage()? { img: img, imgCustoms: imgCustoms}: { vid: vid, vidCustoms: vidCustoms, baseline: baseline})});
document.getElementById("save-modal").classList.add("hidden");
render(); toast("组合已保存到这台设备，下次打开还在");
});
document.getElementById("btn-clear").addEventListener("click", function(){
document.getElementById("clear-title").textContent = "清空" + (isImage()? "图片": "视频") + "链的已选？";
document.getElementById("clear-sub").textContent = "只清当前模式，另一个模式不受影响。" + (!isImage()? "人物基准会保留。": "");
document.getElementById("clear-modal").classList.remove("hidden");
});
document.getElementById("clear-cancel").addEventListener("click", function(){ document.getElementById("clear-modal").classList.add("hidden");});
document.getElementById("clear-confirm").addEventListener("click", function(){
if (isImage()) img = imgInit(); else vid = vidInit();
document.getElementById("clear-modal").classList.add("hidden");
render(); toast(isImage()? "图片链已清空": "视频链已清空（人物基准保留）");
});
document.getElementById("btn-tip").addEventListener("click", function(){ document.getElementById("tip-modal").classList.remove("hidden");});
document.getElementById("tip-close").addEventListener("click", function(){ document.getElementById("tip-modal").classList.add("hidden");});
["save-modal", "clear-modal", "tip-modal"].forEach(function(id){
document.getElementById(id).addEventListener("click", function(e){ if (e.target === this) this.classList.add("hidden");});
});

loadLocal();
render();
</script>
</body>
</html>
